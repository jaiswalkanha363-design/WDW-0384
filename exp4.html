<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Room Booking Form</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background-color: #fcfcfc;
            border: 2px solid #000000;
            padding: 30px 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            color: #000000;
        }

        .form-group {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .form-group label {
            font-weight: bold;
            font-size: 16px;
            margin-right: 12px;
            text-align: right;
            white-space: nowrap;
        }

        .form-group input,
        .form-group select {
            padding: 3px 6px;
            font-family: inherit;
            font-size: 14px;
            border: 1px solid #767676;
            border-radius: 2px;
            box-sizing: border-box;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="tel"] {
            width: 220px;
        }

        .form-group input[type="date"] {
            width: 150px;
        }

        .form-group select {
            width: 130px;
        }

        .form-group input[type="number"] {
            width: 80px;
        }

        .textarea-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .textarea-group label {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .textarea-group textarea {
            width: 100%;
            max-width: 420px;
            height: 90px;
            padding: 6px;
            font-family: inherit;
            font-size: 14px;
            border: 1px solid #767676;
            border-radius: 2px;
            resize: vertical;
            box-sizing: border-box;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .button-group button,
        .button-group input[type="submit"],
        .button-group input[type="reset"] {
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            padding: 3px 10px;
            background-color: #efefef;
            border: 1px solid #767676;
            border-radius: 3px;
            cursor: pointer;
        }

        .button-group button:hover,
        .button-group input:hover {
            background-color: #e2e2e2;
        }

        /* Responsive layout for small viewports */
        @media (max-width: 480px) {
            .form-group {
                flex-direction: column;
                align-items: flex-start;
            }
            .form-group label {
                margin-bottom: 4px;
                text-align: left;
            }
            .form-group input[type="text"],
            .form-group input[type="email"],
            .form-group input[type="tel"],
            .form-group input[type="date"],
            .form-group select,
            .form-group input[type="number"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Hotel Room Booking Form</h1>
        
        <form action="#" method="post">

            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="checkIn">Check-in Date:</label>
                <input type="date" id="checkIn" name="checkIn" required>
            </div>

            <div class="form-group">
                <label for="checkOut">Check-out Date:</label>
                <input type="date" id="checkOut" name="checkOut" required>
            </div>

            <div class="form-group">
                <label for="roomType">Room Type:</label>
                <select id="roomType" name="roomType">
                    <option value="single" selected>Single Room</option>
                    <option value="double">Double Room</option>
                    <option value="suite">Suite</option>
                    <option value="deluxe">Deluxe Room</option>
                </select>
            </div>

            <div class="form-group">
                <label for="guests">Number of Guests:</label>
                <input type="number" id="guests" name="guests" min="1" max="10">
            </div>

            <div class="textarea-group">
                <label for="specialRequests">Special Requests:</label>
                <textarea id="specialRequests" name="specialRequests" rows="4"></textarea>
            </div>

            <div class="button-group">
                <input type="submit" value="Book Now">
                <input type="reset" value="Reset Form">
            </div>

        </form>
    </div>

</body>
</html>
